[project]
name = "my-agent-labs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.129.0",
    "hypercorn>=0.18.0",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.9",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.0.8",
    "neo4j>=6.1.0",
    "pydantic-settings>=2.13.0",
    "python-multipart>=0.0.22",
    "uvicorn>=0.40.0",
]

[tool.flake8]
max-line-length = 88
max-complexity = 12
ignore = ["E402","E501","W503","D100","C901","B008","E203"]
exclude = "__init__.py"
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
default_section = "THIRDPARTY"
known_first_party = []
known_third_party = ["chromadb", "dotenv", "fastapi", "hypercorn", "pydantic", "pydantic_settings", "sentry_sdk", "tiktoken"]
[tool.black]
line-length = 88
[tool.yapf]
align_closing_bracket_with_visual_indent = true
based_on_style = "google"
coalesce_brackets = true
column_limit = 119
dedent_closing_brackets = true
